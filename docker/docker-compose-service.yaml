services:

  user-service:
    build:
      context: ..
      dockerfile: user-service/Dockerfile
      args:
        JAR_FILE: user-service/build/libs/*.jar

    env_file:
      - ../.env

    environment:
      POSTGRES_HOST: postgres
      # DB는 전 서비스 공용. 서비스 구분은 application.yaml의 default_schema가 한다.
      POSTGRES_DB: delivery_db
      REDIS_HOST: redis
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      ZIPKIN_HOST: zipkin

    container_name: user-service

    ports:
      - "9000:9000"

    networks:
      - delivery-network

  delivery-service:
    build:
      context: ..
      dockerfile: delivery-service/Dockerfile
      args:
        JAR_FILE: delivery-service/build/libs/*.jar

    env_file:
      - ../.env

    environment:
      POSTGRES_HOST: postgres
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      ZIPKIN_HOST: zipkin

    container_name: delivery-service

    ports:
      - "9001:9001"

    networks:
      - delivery-network

  company-service:
    build:
      context: ..
      dockerfile: company-service/Dockerfile
      args:
        JAR_FILE: company-service/build/libs/*.jar

    env_file:
      - ../.env

    environment:
      POSTGRES_HOST: postgres
      EUREKA_SERVER_HOST: eureka-server
      ZIPKIN_HOST: zipkin

    container_name: company-service

    ports:
      - "9002:9002"

    networks:
      - delivery-network

  slack-service:
    build:
      context: ..
      dockerfile: slack-service/Dockerfile
      args:
        JAR_FILE: slack-service/build/libs/*.jar

    env_file:
      - ../.env

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: delivery_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EUREKA_URL: http://eureka-server:8761/eureka/
      ZIPKIN_HOST: zipkin

    container_name: slack-service

    ports:
      - "9003:9003"

    networks:
      - delivery-network

  hub-service:
    build:
      context: ..
      dockerfile: hub-service/Dockerfile
      args:
        JAR_FILE: hub-service/build/libs/*.jar

    env_file:
      - ../.env

    # env_file 보다 우선한다. 루트 .env 는 호스트 실행 기준 값(localhost·POSTGRES_PORT 등)을
    # 담고 있어 그대로 쓰면 컨테이너 안에서 어긋난다. 컨테이너 기준 값으로 덮어쓴다.
    #
    # POSTGRES_DB 는 여기서 덮어쓰지 않는다. 호스트·컨테이너에서 값이 같아야 하고,
    # postgres 컨테이너가 만드는 DB 도 루트 .env 의 POSTGRES_DB 하나뿐이다
    # (docker-compose-infra.yaml). 여기서 다른 이름을 박으면 그 DB 가 없어서 기동에 실패한다.
    environment:
      SPRING_PROFILES_ACTIVE: local
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      ZIPKIN_HOST: zipkin

    container_name: hub-service

    ports:
      - "9005:9005"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9005/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - delivery-network

  order-service:
    build:
      context: ..
      dockerfile: order-service/Dockerfile
      args:
        JAR_FILE: order-service/build/libs/*.jar

    env_file:
      - ../.env

    # env_file 보다 우선한다. 루트 .env 는 호스트 실행 기준 값(localhost·POSTGRES_PORT 등)을
    # 담고 있어 그대로 쓰면 컨테이너 안에서 어긋난다. 컨테이너 기준 값으로 덮어쓴다.
    #
    # POSTGRES_DB 는 여기서 덮어쓰지 않는다. postgres 컨테이너가 만드는 DB 는
    # 루트 .env 의 POSTGRES_DB 하나뿐이다 (docker-compose-infra.yaml).
    # 서비스를 가르는 것은 application.yaml 의 default_schema(order_schema) 다.
    environment:
      SPRING_PROFILES_ACTIVE: local
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      ZIPKIN_HOST: zipkin

    container_name: order-service

    ports:
      - "9004:9004"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9004/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - delivery-network


networks:
  delivery-network:
    external: true