      REDIS_HOST: redis
      REDIS_PORT: 6379

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672

      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      ZIPKIN_HOST: zipkin

    container_name: slack-service
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9003/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - delivery-network


  order-service:
    image: ghcr.io/develop-9/delivery-project/order-service:latest

    env_file:
      - .env

    environment:
      SPRING_PROFILES_ACTIVE: prod

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

      REDIS_HOST: redis
      REDIS_PORT: 6379

      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      ZIPKIN_HOST: zipkin

    container_name: order-service
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9004/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - delivery-network


  hub-service:
    image: ghcr.io/develop-9/delivery-project/hub-service:latest

    env_file:
      - .env

    environment:
      SPRING_PROFILES_ACTIVE: prod

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

      REDIS_HOST: redis
      REDIS_PORT: 6379

      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
