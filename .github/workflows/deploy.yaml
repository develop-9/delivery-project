name: Deploy Services

# ============================================================
# Trigger
# ============================================================
#
# main 브랜치에 Push가 발생하면 Workflow를 실행한다.
#
# 실제 자동 Build / Deploy Job은 Commit Message가
# "deploy"로 시작하는 경우에만 실행된다.
#
# 예:
#   deploy: production 배포  -> 실행
#   deploy: hotfix 배포      -> 실행
#   feat: 사용자 API 추가    -> 실행되지 않음
#   fix: 로그인 오류 수정     -> 실행되지 않음
#
# 배포 재시도, hotfix 등 자동 배포 조건을 우회해야 하는 경우
# workflow_dispatch를 통해 수동 배포할 수 있다.
#
# 단, Production 배포이므로 수동 배포 역시 main 브랜치에서만
# Build / Deploy Job이 실행되도록 제한한다.
#

on:
  push:
    branches:
      - main

  workflow_dispatch:


# ============================================================
# Permissions
# ============================================================
#
# contents:
#   Repository Checkout에 필요
#
# packages:
#   GHCR Docker Image Push에 필요
#
# GITHUB_TOKEN은 GitHub Actions가 자동으로 제공한다.
#
# 주의:
#   GitHub Actions의 GITHUB_TOKEN은 Actions Runner에서
#   GHCR Image를 Push할 때 사용한다.
#
#   EC2에서 Private GHCR Image를 Pull할 때는 별도의
#   GHCR_USERNAME / GHCR_TOKEN Secret을 사용한다.
#

permissions:
  contents: read
  packages: write


# ============================================================
# Concurrency
# ============================================================
#
# Production 배포가 동시에 실행되지 않도록 한다.
#
# 이미 진행 중인 배포는 취소하지 않고,
# 완료된 후 다음 배포가 진행된다.
#

concurrency:
  group: production-deployment
  cancel-in-progress: false


# ============================================================
# Environment Variables
# ============================================================

env:
  REGISTRY: ghcr.io

  # 최종 Image:
  #
  # ghcr.io/develop-9/delivery-project/user-service:latest
  # ghcr.io/develop-9/delivery-project/company-service:latest
  #
  IMAGE_PREFIX:
    ${{ github.repository_owner }}/delivery-project


# ============================================================
# Jobs
# ============================================================

jobs:

  # ==========================================================
  # Build & Push
  # ==========================================================

  build:
    name: Build & Push Docker Images

    # 자동 배포:
    #   main Push + Commit Message가 deploy로 시작
    #
    # 수동 배포:
    #   workflow_dispatch + main 브랜치
    #
    # Production 배포이므로 수동 실행 역시 main 브랜치로 제한한다.
    if: |
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        startsWith(github.event.head_commit.message, 'deploy')
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main'
      )

    runs-on: ubuntu-latest

    strategy:
      # 하나의 Service Build가 실패하더라도
      # 다른 Matrix Job은 계속 실행한다.
      #
      # 단, 하나라도 최종 실패하면 Deploy Job은 실행되지 않는다.
      fail-fast: false

      matrix:
        service:
          - eureka-server
          - api-gateway
          - user-service
          - delivery-service
          - company-service
          - slack-service
          - hub-service
          - order-service

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Java Setup
      # ------------------------------------------------------

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle


      # ------------------------------------------------------
      # Gradle Wrapper Permission
      # ------------------------------------------------------

      - name: Grant execute permission for Gradle Wrapper
        run: chmod +x ./gradlew


      # ------------------------------------------------------
      # Test
      # ------------------------------------------------------
      #
      # Docker Image를 생성하기 전에 해당 Service의 테스트를
      # 먼저 실행한다.
      #
      # 테스트가 실패하면 이후 bootJar / Docker Build / Push가
      # 실행되지 않는다.
      #
      # 따라서 테스트를 통과한 코드만 Docker Image로 생성한다.
      #

      - name: Test service
        run: ./gradlew :${{ matrix.service }}:test


      # ------------------------------------------------------
      # Gradle Build
      # ------------------------------------------------------
      #
      # Docker Image에 사용할 실행 가능한 Spring Boot JAR를
      # 생성한다.
      #
      # Test는 위 단계에서 별도로 수행하므로
      # 여기서는 bootJar만 실행한다.
      #

      - name: Build service
        run: ./gradlew :${{ matrix.service }}:bootJar


      # ------------------------------------------------------
      # GHCR Login
      # ------------------------------------------------------
      #
      # GitHub Actions가 제공하는 GITHUB_TOKEN을 사용한다.
      #
      # permissions.packages.write를 통해
      # GHCR에 Docker Image를 Push할 수 있다.
      #
      # 이 인증은 GitHub Actions Runner에서만 적용된다.
      # EC2의 GHCR 인증은 Deploy Job에서 별도로 수행한다.
      #

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ------------------------------------------------------
      # Docker Buildx
      # ------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ------------------------------------------------------
      # Docker Image Build & Push
      # ------------------------------------------------------
      #
      # 두 가지 Tag를 Push한다.
      #
      # 1. SHA
      #    특정 Commit의 Image를 식별할 수 있다.
      #
      # 2. latest
      #    현재 배포 대상 Image를 의미한다.
      #

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile

          push: true

          build-args: |
            JAR_FILE=${{ matrix.service }}/build/libs/*.jar

          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest


  # ==========================================================
  # Deploy to EC2
  # ==========================================================

  deploy:
    name: Deploy to EC2

    # Build와 동일한 Production 배포 조건을 적용한다.
    #
    # push:
    #   main 브랜치에서 deploy로 시작하는 Commit만 실행
    #
    # workflow_dispatch:
    #   main 브랜치에서만 수동 배포 실행
    #
    if: |
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        startsWith(github.event.head_commit.message, 'deploy')
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main'
      )

    # 모든 Matrix Build가 성공한 경우에만
    # EC2 배포를 진행한다.
    needs:
      - build

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Copy Deployment Compose Files
      # ------------------------------------------------------
      #
      # GitHub Repository의 배포용 Compose 파일을
      # EC2의 배포 디렉터리로 복사한다.
      #
      # .env는 복사하지 않는다.
      # 운영 환경의 .env는 EC2에서 별도로 관리한다.
      #
      # source는 여러 파일을 comma-separated 형식으로 지정한다.
      #

      - name: Copy deployment Compose files to EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}

          source: "docker-compose-infra-deploy.yaml,docker-compose-service-deploy.yaml"

          target: ${{ secrets.EC2_DEPLOY_PATH }}


      # ------------------------------------------------------
      # Deploy to EC2
      # ------------------------------------------------------
      #
      # 배포 순서:
      #
      # 1. 배포 파일 확인
      # 2. GHCR Login
      # 3. Infra Image Pull
      # 4. Infra Container 실행
      # 5. Infra Health Check
      # 6. Microservice Image Pull
      # 7. Microservice Container 실행
      # 8. Microservice Status 확인
      # 9. Gateway Health Check
      #

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.5

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}

          script: |

            # SSH Script 중 하나라도 실패하면
            # 즉시 배포를 중단한다.
            set -e

            cd ${{ secrets.EC2_DEPLOY_PATH }}


            # ==================================================
            # 1. Check Deployment Files
            # ==================================================
            #
            # SCP를 통해 배포 파일이 정상적으로 전달되었는지
            # 확인한다.
            #
            # .env는 EC2에서 별도로 관리한다.
            #

            echo "========================================"
            echo "Check Deployment Files"
            echo "========================================"

            test -f docker-compose-infra-deploy.yaml
            test -f docker-compose-service-deploy.yaml
            test -f .env


            # ==================================================
            # 2. GHCR Login
            # ==================================================
            #
            # GHCR Package가 Private이므로
            # EC2에서 Image Pull 전에 GHCR 인증을 수행한다.
            #
            # GHCR_USERNAME:
            #   GitHub 사용자명
            #
            # GHCR_TOKEN:
            #   최소 read:packages 권한을 가진 GitHub Token
            #
            # GitHub Actions Runner에서 수행한 GHCR Login은
            # EC2에 전달되지 않기 때문에 EC2에서 별도로 로그인한다.
            #

            echo "========================================"
            echo "Log in to GHCR"
            echo "========================================"

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
              -u "${{ secrets.GHCR_USERNAME }}" \
              --password-stdin


            # ==================================================
            # 3. Pull Infra Images
            # ==================================================

            echo "========================================"
            echo "Pull Infra Images"
            echo "========================================"

            docker compose \
              -p delivery-infra \
              -f docker-compose-infra-deploy.yaml \
              pull


            # ==================================================
            # 4. Start Infra
            # ==================================================

            echo "========================================"
            echo "Start Infra"
            echo "========================================"

            docker compose \
              -p delivery-infra \
              -f docker-compose-infra-deploy.yaml \
              up -d \
              --remove-orphans


            # ==================================================
            # 5. Infra Health Check
            # ==================================================
            #
            # 모든 Infra Service가 Docker Health Check에서
            # healthy 상태가 될 때까지 대기한다.
            #
            # 최대 120초까지 기다린다.
            #

            echo "========================================"
            echo "Check Infra Health"
            echo "========================================"

            INFRA_SERVICES=(
              eureka-server
              api-gateway
              postgres
              redis
              rabbitmq
              zipkin
            )

            TIMEOUT=120
            INTERVAL=5
            ELAPSED=0

            while true; do

              ALL_HEALTHY=true

              for SERVICE in "${INFRA_SERVICES[@]}"; do

                STATUS=$(docker inspect \
                  --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' \
                  "$SERVICE" 2>/dev/null || echo "not-found")

                echo "$SERVICE : $STATUS"

                if [ "$STATUS" != "healthy" ]; then
                  ALL_HEALTHY=false
                fi

              done

              if [ "$ALL_HEALTHY" = true ]; then
                echo "All infra services are healthy."
                break
              fi

              if [ "$ELAPSED" -ge "$TIMEOUT" ]; then

                echo "Infra health check timed out."

                docker compose \
                  -p delivery-infra \
                  -f docker-compose-infra-deploy.yaml \
                  ps

                exit 1
              fi

              echo "Waiting for infra services..."

              sleep "$INTERVAL"

              ELAPSED=$((ELAPSED + INTERVAL))

            done


            # ==================================================
            # 6. Pull Microservice Images
            # ==================================================
            #
            # Private GHCR에서 Microservice Image를 Pull한다.
            #
            # 앞 단계에서 GHCR Login이 완료되었기 때문에
            # 인증된 상태로 Image를 가져온다.
            #

            echo "========================================"
            echo "Pull Microservice Images"
            echo "========================================"

            docker compose \
              -p delivery-service \
              -f docker-compose-service-deploy.yaml \
              pull


            # ==================================================
            # 7. Start Microservices
            # ==================================================

            echo "========================================"
            echo "Start Microservices"
            echo "========================================"

            docker compose \
              -p delivery-service \
              -f docker-compose-service-deploy.yaml \
              up -d \
              --remove-orphans


            # ==================================================
            # 8. Microservice Status
            # ==================================================
            #
            # Microservice Container의 현재 상태를 출력한다.
            #
            # 이 단계에서는 상태를 출력하고,
            # 최종적인 Application 접근 가능 여부는
            # Gateway Health Check에서 확인한다.
            #

            echo "========================================"
            echo "Microservice Status"
            echo "========================================"

            docker compose \
              -p delivery-service \
              -f docker-compose-service-deploy.yaml \
              ps


            # ==================================================
            # 9. Gateway Health Check
            # ==================================================
            #
            # Microservice가 기동된 후
            # API Gateway의 Actuator Health Endpoint를 확인한다.
            #
            # Gateway가 정상적으로 HTTP 응답을 반환할 때까지
            # 최대 120초 동안 대기한다.
            #

            echo "========================================"
            echo "Gateway Health Check"
            echo "========================================"

            TIMEOUT=120
            INTERVAL=5
            ELAPSED=0

            while true; do

              if curl -fsS http://localhost:8080/actuator/health > /dev/null; then

                echo "Gateway health check passed."
                break

              fi

              if [ "$ELAPSED" -ge "$TIMEOUT" ]; then

                echo "Gateway health check timed out."

                docker compose \
                  -p delivery-infra \
                  -f docker-compose-infra-deploy.yaml \
                  ps

                docker compose \
                  -p delivery-service \
                  -f docker-compose-service-deploy.yaml \
                  ps

                exit 1
              fi

              echo "Waiting for Gateway..."

              sleep "$INTERVAL"

              ELAPSED=$((ELAPSED + INTERVAL))

            done


            # ==================================================
            # Deployment Complete
            # ==================================================

            echo "========================================"
            echo "Deployment completed successfully."
            echo "========================================"

            docker compose \
              -p delivery-infra \
              -f docker-compose-infra-deploy.yaml \
              ps

            docker compose \
              -p delivery-service \
              -f docker-compose-service-deploy.yaml \
              ps