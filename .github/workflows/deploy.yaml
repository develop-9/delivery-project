name: Deploy Services

# ============================================================
# Trigger
# ============================================================
#
# main 브랜치에 Push가 발생하면 Workflow를 실행한다.
#
# 실제 자동 Build / Deploy Job은 Commit Message가
# "deploy"로 시작하는 경우에만 실행된다.
#
# 예:
#   deploy: production 배포  -> 실행
#   deploy: hotfix 배포      -> 실행
#   feat: 사용자 API 추가      -> 실행되지 않음
#   fix: 로그인 오류 수정       -> 실행되지 않음
#
# 배포 재시도, hotfix 등 자동 배포 조건을 우회해야 하는 경우
# workflow_dispatch를 통해 수동 배포할 수 있다.
#
# 단, Production 배포이므로 수동 배포 역시 main 브랜치에서만
# Build / Deploy Job이 실행되도록 제한한다.
#

on:
  push:
    branches:
      - main

  workflow_dispatch:


# ============================================================
# Permissions
# ============================================================
#
# contents:
#   Repository Checkout에 필요
#
# packages:
#   GHCR Docker Image Push에 필요
#
# GITHUB_TOKEN은 GitHub Actions가 자동으로 제공한다.
#
# 주의:
#   GitHub Actions의 GITHUB_TOKEN은 Actions Runner에서
#   GHCR Image를 Push할 때 사용한다.
#
#   EC2에서 Private GHCR Image를 Pull할 때는 별도의
#   GHCR_USERNAME / GHCR_TOKEN Secret을 사용한다.
#

permissions:
  contents: read
  packages: write


# ============================================================
# Concurrency
# ============================================================
#
# Production 배포가 동시에 여러 개 실행되지 않도록 한다.
#
# cancel-in-progress: false
#   이미 진행 중인 배포는 취소하지 않는다.
#   기존 배포가 완료된 후 다음 배포가 실행된다.
#

concurrency:
  group: production-deployment
  cancel-in-progress: false


# ============================================================
# Environment Variables
# ============================================================

env:
  REGISTRY: ghcr.io

  # 최종 Image:
  #
  # ghcr.io/develop-9/delivery-project/user-service:latest
  # ghcr.io/develop-9/delivery-project/company-service:latest
  #
  IMAGE_PREFIX:
    ${{ github.repository_owner }}/delivery-project


# ============================================================
# Jobs
# ============================================================

jobs:

  # ==========================================================
  # Build & Push
  # ==========================================================

  build:
    name: Build & Push Docker Images

    # ----------------------------------------------------------
    # Production 배포 조건
    # ----------------------------------------------------------
    #
    # 자동 배포:
    #   main Push
    #   +
    #   Commit Message가 "deploy"로 시작
    #
    # 수동 배포:
    #   workflow_dispatch
    #   +
    #   main 브랜치
    #

    if: |
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        startsWith(github.event.head_commit.message, 'deploy')
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main'
      )

    runs-on: ubuntu-latest

    strategy:

      # 하나의 Service Build가 실패하더라도
      # 다른 Matrix Job은 계속 실행한다.
      #
      # 단, 하나라도 최종적으로 실패하면
      # needs: build를 사용하는 Deploy Job은 실행되지 않는다.
      #
      fail-fast: false

      matrix:
        service:
          - eureka-server
          - api-gateway
          - user-service
          - delivery-service
          - company-service
          - slack-service
          - hub-service
          - order-service

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Java Setup
      # ------------------------------------------------------
      #
      # 각 Service가 독립적인 Gradle Wrapper를 사용하므로
      # Matrix에서 선택된 Service의 Gradle 설정을 기준으로
      # Gradle Cache를 구성한다.
      #

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: ${{ matrix.service }}/gradle/wrapper/gradle-wrapper.properties


      # ------------------------------------------------------
      # Gradle Wrapper Permission
      # ------------------------------------------------------
      #
      # Service 디렉터리 내부의 Gradle Wrapper를 실행하기 위해
      # 실행 권한을 부여한다.
      #

      - name: Grant execute permission for Gradle Wrapper
        working-directory: ${{ matrix.service }}
        run: chmod +x ./gradlew


      # ------------------------------------------------------
      # Gradle Build
      # ------------------------------------------------------
      #
      # 실행 가능한 Spring Boot JAR를 생성한다.
      #
      # 각 Service의 build.gradle에서:
      #
      # tasks.named('jar') {
      #     enabled = false
      # }
      #
      # 를 설정하여 일반 JAR 및 plain JAR 생성을 비활성화한다.
      #

      - name: Build service
        working-directory: ${{ matrix.service }}
        run: ./gradlew bootJar


      # ------------------------------------------------------
      # Verify Boot JAR
      # ------------------------------------------------------
      #
      # Docker Build 전에 bootJar가 정상적으로 생성되었는지
      # 확인한다.
      #
      # jar task가 비활성화되어 있기 때문에
      # build/libs에는 실행 가능한 JAR 하나만 존재해야 한다.
      #

      - name: Verify Boot JAR
        working-directory: ${{ matrix.service }}
        shell: bash
        run: |
          JAR_COUNT=$(find build/libs \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            | wc -l)

          if [ "$JAR_COUNT" -ne 1 ]; then
            echo "Expected exactly one JAR file."
            echo "Found ${JAR_COUNT} JAR file(s):"
            find build/libs \
              -maxdepth 1 \
              -type f \
              -name "*.jar"
            exit 1
          fi

          echo "Boot JAR:"
          find build/libs \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            -print


      # ------------------------------------------------------
      # GHCR Login
      # ------------------------------------------------------
      #
      # GitHub Actions가 제공하는 GITHUB_TOKEN을 사용한다.
      #
      # permissions.packages.write를 통해
      # GHCR에 Docker Image를 Push할 수 있다.
      #
      # 이 인증은 GitHub Actions Runner에서만 적용된다.
      #
      # EC2의 GHCR 인증은 Deploy Job에서 별도로 수행한다.
      #

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ------------------------------------------------------
      # Docker Buildx
      # ------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ------------------------------------------------------
      # Docker Image Build & Push
      # ------------------------------------------------------
      #
      # Dockerfile은 각 Service 디렉터리에 존재한다.
      #
      # context는 Repository Root로 지정한다.
      #
      # build/libs에는 JAR 하나만 존재하므로
      # wildcard를 사용하여 해당 JAR를 Docker Image에 포함한다.
      #
      # Tag:
      #
      # 1. github.sha
      #    특정 Commit의 Image를 식별한다.
      #
      # 2. latest
      #    현재 배포 대상 Image를 의미한다.
      #

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile

          push: true

          build-args: |
            JAR_FILE=${{ matrix.service }}/build/libs/*.jar

          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest


  # ==========================================================
  # Deploy to EC2
  # ==========================================================

  deploy:
    name: Deploy to EC2

    # ----------------------------------------------------------
    # Production 배포 조건
    # ----------------------------------------------------------
    #
    # Build Job과 동일한 조건을 적용한다.
    #
    # push:
    #   main 브랜치에서 deploy로 시작하는 Commit만 실행
    #
    # workflow_dispatch:
    #   main 브랜치에서만 수동 실행
    #

    if: |
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        startsWith(github.event.head_commit.message, 'deploy')
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main'
      )

    # 모든 Matrix Build가 성공한 경우에만
    # EC2 배포를 진행한다.
    needs:
      - build

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Copy Deployment Compose Files
      # ------------------------------------------------------
      #
      # Repository의 배포용 Compose 파일을
      # EC2의 배포 디렉터리로 복사한다.
      #
      # 운영 환경의 .env는 EC2에서 별도로 관리하므로
      # Repository의 .env는 복사하지 않는다.
      #
      # source는 comma-separated 형식으로 여러 파일을 지정한다.
      #
      # Repository:
      #
      # docker/
      # ├── docker-compose-infra-deploy.yaml
      # └── docker-compose-service-deploy.yaml
      #
      # ↓
      #
      # EC2:
      #
      # $EC2_DEPLOY_PATH/
      # ├── docker-compose-infra-deploy.yaml
      # └── docker-compose-service-deploy.yaml
      #

      - name: Copy deployment Compose files to EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}

          source: "docker/docker-compose-infra-deploy.yaml,docker/docker-compose-service-deploy.yaml"
          target: ${{ secrets.EC2_DEPLOY_PATH }}
          strip_components: 1


      # ------------------------------------------------------
      # Deploy to EC2
      # ------------------------------------------------------
      #
      # 전체 배포 순서:
      #
      # 1. 배포 파일 확인
      # 2. Docker Network 확인
      # 3. GHCR Login
      # 4. Infra Image Pull
      # 5. Infra Container 실행
      # 6. Infra Health Check
      # 7. Microservice Image Pull
      # 8. Microservice Container 실행
      # 9. Microservice Status 확인
      # 10. Microservice Health Check
      # 11. 최종 Container Status 확인
      #

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.5

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}

          script: |

            # SSH Script 중 하나라도 실패하면
            # 즉시 배포를 중단한다.
            set -e
            
            # ==================================================
            # 1. Check Deployment Files
            # ==================================================
            #
            # SCP를 통해 배포용 Compose 파일이 정상적으로
            # 전달되었는지 확인한다.
            #
            # .env는 EC2에서 별도로 관리하므로
            # Repository에서 복사하지 않는다.
            #

            cd ${{ secrets.EC2_DEPLOY_PATH }}

            echo "========================================"
            echo "Check Deployment Files"
            echo "========================================"

            test -f docker-compose-infra-deploy.yaml
            test -f docker-compose-service-deploy.yaml
            test -f .env


            # ==================================================
            # 2. Check Docker Network
            # ==================================================
            #
            # 두 Compose 파일 모두 delivery-network를
            # external network로 사용한다.
            #
            # external network는 Docker Compose가 자동으로
            # 생성하지 않으므로 EC2에 사전에 존재해야 한다.
            #
            # 최초 EC2 구성 시:
            #
            # docker network create delivery-network
            #
            # 를 수행해야 한다.
            #
            
            echo "========================================"
            echo "Check Docker Network"
            echo "========================================"

            docker network inspect delivery-network > /dev/null 2>&1 || {
              echo "delivery-network does not exist."
              exit 1
            }


            # ==================================================
            # 3. GHCR Login
            # ==================================================
            #
            # GHCR Package가 Private이므로
            # EC2에서 Image Pull 전에 GHCR 인증을 수행한다.
            #
            # GHCR_USERNAME:
            #   GitHub 사용자명
            #
            # GHCR_TOKEN:
            #   최소 read:packages 권한을 가진 Token
            #
            # GitHub Actions Runner의 Docker Login은
            # EC2로 전달되지 않기 때문에
            # EC2에서 별도로 로그인한다.
            #

            echo "========================================"
            echo "Log in to GHCR"
            echo "========================================"

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
              -u "${{ secrets.GHCR_USERNAME }}" \
              --password-stdin


            # ==================================================
            # 4. Pull Infra Images
            # ==================================================
            #
            # Private GHCR에서 Infra Image를 가져온다.
            #

            echo "========================================"
            echo "Pull Infra Images"
            echo "========================================"

            docker compose \
              -p delivery-infra \
              -f docker-compose-infra-deploy.yaml \
              pull


            # ==================================================
            # 5. Start Infra
            # ==================================================
            #
            # Infra Container를 백그라운드에서 실행한다.
            #
            # --remove-orphans:
            #   현재 Compose 파일에 정의되지 않은
            #   동일 프로젝트의 기존 Container를 제거한다.
            #

            echo "========================================"
            echo "Start Infra"
            echo "========================================"

            docker compose \
              -p delivery-infra \
              -f docker-compose-infra-deploy.yaml \
              up -d \
              --remove-orphans


            # ==================================================
            # 6. Infra Health Check
            # ==================================================
            #
            # 모든 Infra Container가 Docker Health Check에서
            # healthy 상태가 될 때까지 대기한다.
            #
            # 최대 120초까지 기다린다.
            #
            # 대상:
            #
            # eureka-server
            # api-gateway
            # postgres
            # redis
            # rabbitmq
            # zipkin
            #
            # 각 Container의 Compose healthcheck 설정이
            # 반드시 존재해야 한다.
            #

            echo "========================================"
            echo "Check Infra Health"
            echo "========================================"

            INFRA_SERVICES=(
              eureka-server
              api-gateway
              postgres
              redis
              rabbitmq
              zipkin
            )

            TIMEOUT=120
            INTERVAL=5
            ELAPSED=0

            while true; do

              ALL_HEALTHY=true

              for SERVICE in "${INFRA_SERVICES[@]}"; do

                STATUS=$(docker inspect \
                  --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' \
                  "$SERVICE" 2>/dev/null || echo "not-found")

                echo "$SERVICE : $STATUS"

                if [ "$STATUS" != "healthy" ]; then
                  ALL_HEALTHY=false
                fi

              done

              if [ "$ALL_HEALTHY" = true ]; then
                echo "All infra services are healthy."
                break
              fi

              if [ "$ELAPSED" -ge "$TIMEOUT" ]; then

                echo "Infra health check timed out."

                docker compose \
                  -p delivery-infra \
                  -f docker-compose-infra-deploy.yaml \
                  ps

                exit 1
              fi

              echo "Waiting for infra services..."

              sleep "$INTERVAL"

              ELAPSED=$((ELAPSED + INTERVAL))

            done


            # ==================================================
            # 7. Pull Microservice Images
            # ==================================================
            #
            # Private GHCR에서 Microservice Image를 가져온다.
            #
            # 앞 단계에서 GHCR Login이 완료되었으므로
            # 인증된 상태로 Image를 Pull한다.
            #

            echo "========================================"
            echo "Pull Microservice Images"
            echo "========================================"

            docker compose \
              -p delivery-service \
              -f docker-compose-service-deploy.yaml \
              pull


            # ==================================================
            # 8. Start Microservices
            # ==================================================
            #
            # Microservice Container를 실행한다.
            #
            # Infra Health Check가 완료된 이후 실행되므로
            # Eureka / DB / Redis / RabbitMQ 등의 기본 Infra가
            # 정상적으로 기동된 상태에서 Service를 시작한다.
            #

            echo "========================================"
            echo "Start Microservices"
            echo "========================================"

            docker compose \
              -p delivery-service \
              -f docker-compose-service-deploy.yaml \
              up -d \
              --remove-orphans


            # ==================================================
            # 9. Microservice Status
            # ==================================================
            #
            # Microservice Container가 생성되고 실행되었는지
            # 현재 상태를 출력한다.
            #
            # 실제 정상 여부는 다음 Health Check에서 검증한다.
            #

            echo "========================================"
            echo "Microservice Status"
            echo "========================================"

            docker compose \
              -p delivery-service \
              -f docker-compose-service-deploy.yaml \
              ps


            # ==================================================
            # 10. Microservice Health Check
            # ==================================================
            #
            # 각 Microservice가 Docker Health Check에서
            # healthy 상태가 될 때까지 순차적으로 대기한다.
            #
            # 대상:
            #
            # user-service
            # delivery-service
            # company-service
            # slack-service
            # hub-service
            # order-service
            #
            # 실제 Actuator URL 호출은 각 Container 내부의
            # Docker healthcheck에서 수행한다.
            #
            # 따라서 Service Port를 EC2 외부에 공개할 필요는 없다.
            #
            # 단, Docker healthcheck에서 사용하는 curl이
            # 각 Service Image 내부에 설치되어 있어야 한다.
            #

            SERVICES=(
              user-service
              delivery-service
              company-service
              slack-service
              hub-service
              order-service
            )
              
            TIMEOUT=120
            INTERVAL=5
            
            for SERVICE in "${SERVICES[@]}"; do
          
              ELAPSED=0
          
              echo ""
              echo "========================================"
              echo "${SERVICE} Health Check"
              echo "========================================"
          
              while true; do
            
                STATUS=$(docker inspect \
                  --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' \
                  "$SERVICE" 2>/dev/null || true)
              
                # --------------------------------------------
                # Healthy
                # --------------------------------------------
              
                if [ "$STATUS" = "healthy" ]; then
                  echo "${SERVICE} health check passed."
                  break
                fi
            
            
                # --------------------------------------------
                # Unhealthy
                # --------------------------------------------
            
                if [ "$STATUS" = "unhealthy" ]; then
                  echo "${SERVICE} health check failed."
                  
                  docker compose \
                    -p delivery-service \
                    -f docker-compose-service-deploy.yaml \
                    ps
                  
                  echo "----------------------------------------"
                  echo "${SERVICE} logs"
                  echo "----------------------------------------"
                  
                  docker logs "$SERVICE" --tail 100
                  
                  exit 1
                fi
            
            
                # --------------------------------------------
                # Container Not Found
                # --------------------------------------------

                if [ "$STATUS" = "not-found" ]; then
                  echo "${SERVICE} container was not found."

                  docker compose \
                    -p delivery-service \
                    -f docker-compose-service-deploy.yaml \
                    ps

                  exit 1

                fi


                # --------------------------------------------
                # Healthcheck Not Configured
                # --------------------------------------------

                if [ "$STATUS" = "no-healthcheck" ]; then
                  echo "${SERVICE} does not have a healthcheck."

                  docker compose \
                    -p delivery-service \
                    -f docker-compose-service-deploy.yaml \
                    ps

                  exit 1

                fi


                # --------------------------------------------
                # Timeout
                # --------------------------------------------

                if [ "$ELAPSED" -ge "$TIMEOUT" ]; then
                  echo "${SERVICE} health check timed out."

                  docker compose \
                    -p delivery-service \
                    -f docker-compose-service-deploy.yaml \
                    ps

                  echo "----------------------------------------"
                  echo "${SERVICE} logs"
                  echo "----------------------------------------"
            
                  docker logs "$SERVICE" --tail 100

                  exit 1

                fi
              
                echo "${SERVICE}: ${STATUS:-container not found}"
                
                sleep "$INTERVAL"
                
                ELAPSED=$((ELAPSED + INTERVAL))
              
              done
            
            done


            # ==================================================
            # 11. Deployment Complete
            # ==================================================
            #
            # 모든 Infra와 Microservice가 Health Check를
            # 통과한 경우에만 배포 성공으로 처리한다.
            #

            echo "========================================"
            echo "Final Infra Status"
            echo "========================================"

            docker compose \
              -p delivery-infra \
              -f docker-compose-infra-deploy.yaml \
              ps

            # --------------------------------------------------
            # Final Microservice Status
            # --------------------------------------------------

            echo "========================================"
            echo "Final Microservice Status"
            echo "========================================"

            docker compose \
              -p delivery-service \
              -f docker-compose-service-deploy.yaml \
              ps