name: Deploy Services

# ============================================================
# Trigger
# ============================================================
#
# main 브랜치에 Push가 발생하면 Workflow를 실행한다.
#
# 실제 Build / Deploy Job은 Commit Message가
# "deploy"로 시작하는 경우에만 실행된다.
#
# 예:
#   deploy: production 배포  -> 실행
#   deploy: hotfix 배포      -> 실행
#   feat: 사용자 API 추가      -> 실행되지 않음
#   fix: 로그인 오류 수정       -> 실행되지 않음
#

on:
  push:
    branches:
      - main


# ============================================================
# Permissions
# ============================================================
#
# contents:
#   Repository Checkout에 필요
#
# packages:
#   GHCR Docker Image Push에 필요
#
# GITHUB_TOKEN은 GitHub Actions가 자동으로 제공한다.
#

permissions:
  contents: read
  packages: write


# ============================================================
# Concurrency
# ============================================================
#
# Production 배포가 동시에 실행되지 않도록 한다.
#
# 이미 진행 중인 배포는 취소하지 않고,
# 완료된 후 다음 배포가 진행된다.
#

concurrency:
  group: production-deployment
  cancel-in-progress: false


# ============================================================
# Environment Variables
# ============================================================

env:
  REGISTRY: ghcr.io

  # 최종 Image:
  #
  # ghcr.io/develop-9/delivery/user-service:latest
  # ghcr.io/develop-9/delivery/company-service:latest
  #
  IMAGE_PREFIX: ${{ github.repository_owner }}/delivery


# ============================================================
# Jobs
# ============================================================

jobs:

  # ==========================================================
  # Build & Push
  # ==========================================================

  build:
    name: Build & Push Docker Images

    if: startsWith(github.event.head_commit.message, 'deploy')

    runs-on: ubuntu-latest

    strategy:
      # 하나의 Service Build가 실패하더라도
      # 다른 Matrix Job은 계속 실행한다.
      #
      # 단, 하나라도 최종 실패하면 Deploy Job은 실행되지 않는다.
      fail-fast: false

      matrix:
        service:
          - eureka-server
          - api-gateway
          - user-service
          - delivery-service
          - company-service
          - slack-service
          - hub-service
          - order-service

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Java Setup
      # ------------------------------------------------------

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle


      # ------------------------------------------------------
      # Gradle Wrapper Permission
      # ------------------------------------------------------

      - name: Grant execute permission for Gradle Wrapper
        run: chmod +x ./gradlew


      # ------------------------------------------------------
      # Gradle Build
      # ------------------------------------------------------

      - name: Build service
        run: ./gradlew :${{ matrix.service }}:build


      # ------------------------------------------------------
      # GHCR Login
      # ------------------------------------------------------
      #
      # GitHub Actions가 제공하는 GITHUB_TOKEN을 사용한다.
      #
      # permissions.packages.write를 통해
      # GHCR에 Docker Image를 Push할 수 있다.
      #

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ------------------------------------------------------
      # Docker Buildx
      # ------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ------------------------------------------------------
      # Docker Image Build & Push
      # ------------------------------------------------------
      #
      # 두 가지 Tag를 Push한다.
      #
      # 1. SHA
      #    특정 Commit의 Image를 식별할 수 있다.
      #
      # 2. latest
      #    현재 배포 대상 Image를 의미한다.
      #

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile

          push: true

          build-args: |
            JAR_FILE=${{ matrix.service }}/build/libs/*.jar

          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest


  # ==========================================================
  # Deploy to EC2
  # ==========================================================

  deploy:
    name: Deploy to EC2

    if: startsWith(github.event.head_commit.message, 'deploy')

    needs:
      - build

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Copy Deployment Compose Files
      # ------------------------------------------------------
      #
      # GitHub Repository의 배포용 Compose 파일을
      # EC2의 배포 디렉터리로 복사한다.
      #
      # .env는 복사하지 않는다.
      # 운영 환경의 .env는 EC2에서 별도로 관리한다.
      #

      - name: Copy deployment Compose files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}

          source: |
            docker-compose-infra-deploy.yaml
            docker-compose-services-deploy.yaml

          target: ${{ secrets.EC2_DEPLOY_PATH }}


      # ------------------------------------------------------
      # Deploy to EC2
      # ------------------------------------------------------
      #
      # 배포 순서:
      #
      # 1. 배포 파일 확인
      # 2. Infra Image Pull
      # 3. Infra Container 실행
      # 4. Infra Health Check
      # 5. Microservice Image Pull
      # 6. Microservice Container 실행
      # 7. Gateway Health Check
      #

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}

          script: |

            set -e

            cd ${{ secrets.EC2_DEPLOY_PATH }}


            # ==================================================
            # 1. Check Deployment Files
            # ==================================================

            echo "========================================"
            echo "Check Deployment Files"
            echo "========================================"

            test -f docker-compose-infra-deploy.yaml
            test -f docker-compose-services-deploy.yaml
            test -f .env


            # ==================================================
            # 2. Pull Infra Images
            # ==================================================

            echo "========================================"
            echo "Pull Infra Images"
            echo "========================================"

            docker compose \
              -f docker-compose-infra-deploy.yaml \
              pull


            # ==================================================
            # 3. Start Infra
            # ==================================================

            echo "========================================"
            echo "Start Infra"
            echo "========================================"

            docker compose \
              -f docker-compose-infra-deploy.yaml \
              up -d \
              --remove-orphans


            # ==================================================
            # 4. Infra Health Check
            # ==================================================

            echo "========================================"
            echo "Check Infra Health"
            echo "========================================"

            INFRA_SERVICES=(
              eureka-server
              api-gateway
              postgres
              redis
              rabbitmq
              zipkin
            )

            TIMEOUT=120
            INTERVAL=5
            ELAPSED=0

            while true; do

              ALL_HEALTHY=true

              for SERVICE in "${INFRA_SERVICES[@]}"; do

                STATUS=$(docker inspect \
                  --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' \
                  "$SERVICE" 2>/dev/null || echo "not-found")

                echo "$SERVICE : $STATUS"

                if [ "$STATUS" != "healthy" ]; then
                  ALL_HEALTHY=false
                fi

              done

              if [ "$ALL_HEALTHY" = true ]; then
                echo "All infra services are healthy."
                break
              fi

              if [ "$ELAPSED" -ge "$TIMEOUT" ]; then

                echo "Infra health check timed out."

                docker compose \
                  -f docker-compose-infra-deploy.yaml \
                  ps

                exit 1

              fi

              echo "Waiting for infra services..."

              sleep "$INTERVAL"

              ELAPSED=$((ELAPSED + INTERVAL))

            done


            # ==================================================
            # 5. Pull Microservice Images
            # ==================================================

            echo "========================================"
            echo "Pull Microservice Images"
            echo "========================================"

            docker compose \
              -f docker-compose-services-deploy.yaml \
              pull


            # ==================================================
            # 6. Start Microservices
            # ==================================================

            echo "========================================"
            echo "Start Microservices"
            echo "========================================"

            docker compose \
              -f docker-compose-services-deploy.yaml \
              up -d \
              --remove-orphans


            # ==================================================
            # 7. Microservice Status
            # ==================================================

            echo "========================================"
            echo "Microservice Status"
            echo "========================================"

            docker compose \
              -f docker-compose-services-deploy.yaml \
              ps


            # ==================================================
            # 8. Gateway Health Check
            # ==================================================

            echo "========================================"
            echo "Gateway Health Check"
            echo "========================================"

            TIMEOUT=120
            INTERVAL=5
            ELAPSED=0

            while true; do

              if curl -fsS http://localhost:8080/actuator/health > /dev/null; then

                echo "Gateway health check passed."

                break

              fi

              if [ "$ELAPSED" -ge "$TIMEOUT" ]; then

                echo "Gateway health check timed out."

                docker compose \
                  -f docker-compose-infra-deploy.yaml \
                  -f docker-compose-services-deploy.yaml \
                  ps

                exit 1

              fi

              echo "Waiting for Gateway..."

              sleep "$INTERVAL"

              ELAPSED=$((ELAPSED + INTERVAL))

            done


            # ==================================================
            # Deployment Complete
            # ==================================================

            echo "========================================"
            echo "Deployment completed successfully."
            echo "========================================"

            docker compose \
              -f docker-compose-infra-deploy.yaml \
              -f docker-compose-services-deploy.yaml \
              ps
