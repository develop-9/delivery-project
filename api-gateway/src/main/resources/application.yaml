server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      # 미설정 시 Redis가 죽으면 Lettuce가 재연결/큐잉을 계속 시도하며 커맨드가 거의
      # 무한정 대기한다. RedisTokenBlacklistChecker가 이 타임아웃을 RedisCommandTimeoutException으로
      # 받아 fail-open으로 넘어가므로, 값이 너무 크면 그동안 모든 인증 요청이 지연된다.
      # 아래 httpclient 타임아웃(connect-timeout 2000ms)과 맞춘다.
      timeout: 2000ms
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 5s
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: "${CORS_ALLOWED_ORIGINS:http://localhost:3000}"
                allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowedHeaders: "*"
                maxAge: 3600

jwt:
  secret: ${JWT_SECRET:local-dev-only-secret-key-please-override-in-env-file-32bytes-min}

# Redis 장애 시 매 요청마다 타임아웃(2초)을 기다리지 않고, 임계치를 넘으면 즉시 fail-open
# 처리한다(User Service와 동일 설정).
resilience4j:
  circuitbreaker:
    instances:
      redis:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: http://${ZIPKIN_HOST:localhost}:9411/api/v2/spans
