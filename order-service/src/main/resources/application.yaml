server:
  port: ${SERVER_PORT:9004}

spring:
  application:
    name: order-service

  # 호스트에서 직접 띄울 때만 쓰인다. 저장소 루트의 .env 를 프로퍼티로 읽는다.
  # 실행 위치가 저장소 루트일 수도, order-service 일 수도 있어 두 경로를 모두 건다.
  # 컨테이너에는 .env 파일이 없고 compose 의 env_file · environment 가 값을 넣으므로 무관하다.
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  # 프로파일 기본값을 두지 않는다. 기본값이 있으면 배포 때 SPRING_PROFILES_ACTIVE 를
  # 빼먹어도 조용히 개발 설정(ddl-auto: update)으로 떠서 운영 스키마가 자동 변경된다.
  #   컨테이너 : docker-compose-service.yaml 의 environment 가 local 을 지정
  #   IDE 실행 : 실행 구성에 -Dspring.profiles.active=local

  # 전 서비스가 DB 하나(delivery_db)를 공유하고 스키마로 분리한다.
  # DB 를 나누지 않으므로 POSTGRES_DB 기본값은 서비스마다 같아야 하고,
  # 서비스를 가르는 것은 default_schema 다.
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:delivery_db}
    username: ${POSTGRES_USERNAME:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # 스키마는 Flyway 가 소유한다. 프로파일과 무관하게 항상 돈다.
  # prod 는 ddl-auto: validate 라 테이블을 만들지 않는데, 배포 경로 어디에도 테이블을 만드는
  # 주체가 없어서(docker/postgres/init.sql 은 CREATE SCHEMA 만 한다) EC2 새 DB 에서
  # validate 실패로 무한 재기동에 빠졌다. 그 구멍을 메우는 설정이다.
  # Hibernate 보다 먼저 실행된다(Boot 이 DataSource 초기화 시점에 돌린다).
  flyway:
    enabled: true
    # 스키마가 없으면 Flyway 가 만든다. init.sql 에 의존하지 않는다.
    schemas: order_schema
    locations: classpath:db/migration
    # 이미 ddl-auto 로 테이블이 만들어진 기존 DB 에는 baseline 을 찍고 V1 부터 적용한다.
    # V1·V2 가 전부 멱등하게(IF NOT EXISTS / DROP→ADD) 쓰여 있어 안전하다.
    baseline-on-migrate: true
    baseline-version: 0

  # ddl-auto 는 프로파일별로 다르므로 여기에 두지 않는다.
  # 프로파일 없이 뜨면 스키마를 건드리지 않는 쪽(Hibernate 기본값)으로 동작한다.
  jpa:
    open-in-view: false
    properties:
      hibernate:
        # order-service 소유 스키마. Hibernate 는 스키마를 만들지 않으므로
        # docker/postgres/init.sql 이 CREATE SCHEMA 로 미리 만들어 둔다.
        # 이름은 팀 컨벤션 {서비스}_schema 를 따른다 (init.sql 주석 기준).
        # 스키마명을 order 로 하면 SQL 예약어라 from order.p_orders 가 문법 오류로 깨진다.
        default_schema: order_schema
        # 컬렉션 N+1 완화 (주문 여러 건의 items 를 IN 절로 묶어 가져온다)
        default_batch_fetch_size: 100

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

# 인증된 행위자가 없는 상태에서 생성되는 행의 created_by/updated_by 에 쓰는
# 팀 공통 시스템 주체 ID. 전 서비스가 같은 값을 쓰도록 .env 에서 관리한다.
system:
  id: ${SYSTEM_ID:00000000-0000-0000-0000-000000000000}

order:
  idempotency:
    # 처리 중 표시가 남는 시간. 서버가 죽어 정리를 못 해도 이 시간이 지나면 풀린다.
    # 주문 한 건 처리(업체·사용자·배송 호출)보다 넉넉해야 하고, 너무 길면 재시도가 막힌다.
    in-progress-ttl-seconds: ${ORDER_IDEMPOTENCY_IN_PROGRESS_TTL:300}
    # 완료 기록이 남는 시간. 이 안에 같은 키로 오면 만들어진 주문을 그대로 돌려준다.
    completed-ttl-hours: ${ORDER_IDEMPOTENCY_COMPLETED_TTL:24}

# 게이트웨이가 검증한 토큰을 이 서비스에서 다시 파싱한다.
# 전 서비스가 같은 비밀키를 써야 하므로 루트 .env 의 JWT_SECRET 을 그대로 받는다.
jwt:
  secret: ${JWT_SECRET:local-dev-only-secret-key-please-override-in-env-file-32bytes-min}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      # 개발 단계에서는 전량 수집, 운영 전환 시 0.1 수준으로 조정
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      zipkin:
        # Boot 4 기준 프로퍼티 (구 management.zipkin.tracing.*은 deprecation level=error)
        endpoint: http://${ZIPKIN_HOST:localhost}:${ZIPKIN_PORT:9411}/api/v2/spans

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # 태그·오퍼레이션을 알파벳순으로 정렬해 화면 순서가 매번 바뀌지 않게 한다
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.delivery_project.order_service: debug

---
# 로컬 개발. 실행 수단이 docker 든 IDE 든 개발 환경이면 이 프로파일이다.
spring:
  config:
    activate:
      on-profile: local

  # 테이블은 Flyway 가 이미 만들어 둔 뒤다. db/schema.sql 은 V2 마이그레이션으로 옮겼고,
  # 스키마 생성도 Flyway(schemas: order_schema)가 하므로 hbm2ddl.create_namespaces 도 뺐다.
  #
  # ⚠️ ddl-auto 를 update 로 남긴 것은 delivery-service 와 맞춘 것이고, 개발 중 엔티티 변경이
  #    바로 반영되게 하려는 것이다. 대신 그 변경은 로컬에만 조용히 반영되고 마이그레이션에는
  #    남지 않으므로, 그대로 배포하면 prod 의 validate 가 튕긴다.
  #    엔티티 컬럼을 바꿨다면 db/migration 에 V3, V4... 를 반드시 같이 추가한다.
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

---
# 배포. 스키마는 Flyway(db/migration)가 만들고 앱은 검증만 한다.
# ddl-auto 가 운영 스키마를 건드리지 못하게 하고, 부분 인덱스·CHECK 제약처럼
# ddl-auto 가 만들지 못하는 것까지 마이그레이션이 책임진다.
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

logging:
  level:
    com.delivery_project.order_service: info
