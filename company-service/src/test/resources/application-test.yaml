spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/delivery
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop

    properties:
      hibernate:
        default_schema: public
        format_sql: true

    show-sql: true

  cloud:
    discovery:
      enabled: false

eureka:
  client:
    enabled: false

management:
  tracing:
    sampling:
      probability: 0

    export:
      zipkin:
        enabled: false

logging:
  level:
    root: INFO