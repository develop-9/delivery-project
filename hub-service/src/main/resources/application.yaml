server:
  port: 9005

spring:
  application:
    name: hub-service

  # 호스트에서 직접 띄울 때만 쓰인다. 저장소 루트의 .env 를 프로퍼티로 읽는다.
  # 실행 위치가 저장소 루트일 수도, hub-service 일 수도 있어 두 경로를 모두 건다.
  # 컨테이너에는 .env 파일이 없고 compose 의 env_file · environment 가 값을 넣으므로 무관하다.
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  # 프로파일 기본값을 두지 않는다. 기본값이 있으면 어느 프로파일로 떠 있는지가
  # 실행 구성에 드러나지 않아, 잘못된 설정으로 뜬 것을 알아채기 어렵다.
  #   로컬 컨테이너 : docker-compose-service.yaml 의 environment 가 local 을 지정
  #   배포 컨테이너 : docker-compose-service-deploy.yaml 의 environment 가 prod 를 지정
  #   IDE 실행      : 실행 구성에 -Dspring.profiles.active=local

  # 전 서비스가 DB 하나(delivery_db)를 공유하고 스키마로 분리한다.
  # DB 를 나누지 않으므로 POSTGRES_DB 기본값은 서비스마다 같아야 하고,
  # 서비스를 가르는 것은 default_schema 다.
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:delivery_db}
    username: ${POSTGRES_USERNAME:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # ddl-auto 는 프로파일별로 다르므로 여기에 두지 않는다.
  # 프로파일 없이 뜨면 스키마를 건드리지 않는 쪽(Hibernate 기본값)으로 동작한다.
  jpa:
    open-in-view: false
    properties:
      hibernate:
        # hub-service 소유 스키마. Hibernate 는 스키마를 만들지 않으므로
        # docker/postgres/init.sql 이 CREATE SCHEMA 로 미리 만들어 둔다.
        default_schema: hub_schema
        default_batch_fetch_size: 100

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# 인증된 행위자가 없는 상태에서 생성되는 행의 created_by/updated_by 에 쓰는
# 팀 공통 시스템 주체 ID. 전 서비스가 같은 값을 써야 한다.
system:
  id: ${SYSTEM_ID:00000000-0000-0000-0000-000000000000}

# 토큰 발급은 user-service 가 한다. hub-service 는 서명 검증·파싱만 하므로 secret 만 있으면 된다.
# user-service 와 반드시 같은 값이어야 하고, 다르면 모든 요청이 401 이 된다.
jwt:
  secret: ${JWT_SECRET:local-dev-only-secret-key-please-override-in-env-file-32bytes-min}

# 내부 다건 조회(03_internal.md 13번)가 한 번에 받아줄 hubIds 개수 상한.
# 허브 개수가 아니라 IN 절 크기를 제한하는 API 계약이라 허브가 늘어도 그대로 둔다.
# 바꾸면 03_internal.md 의 제약도 함께 고친다.
hub:
  internal:
    batch-max-size: ${HUB_INTERNAL_BATCH_MAX_SIZE:100}

# 이동정보의 거리·시간 자동 산출(D8)은 아직 연동하지 않았다. 값은 요청으로 직접 받는다.
# 연동을 넣을 때 map.naver 설정과 환경변수(.env.example)를 함께 되살린다.

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: http://${ZIPKIN_HOST:localhost}:9411/api/v2/spans

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

logging:
  level:
    com.delivery_project.hub_service: debug

---
# 로컬 개발. 실행 수단이 docker 든 IDE 든 개발 환경이면 이 프로파일이다.
spring:
  config:
    activate:
      on-profile: local

  # ddl-auto 가 테이블을 만든 뒤 db/schema.sql 이 제약을 덧붙인다.
  # 부분 인덱스·CHECK 는 ddl-auto 가 만들지 못해 이 스크립트가 없으면 안전망이 비는 상태가 된다.
  # defer-datasource-initialization 이 있어야 Hibernate 다음에 실행된다 (기본은 그 전).
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

  jpa:
    defer-datasource-initialization: true
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        # ddl-auto 는 기본적으로 스키마를 만들지 않는다. hub_schema 가 없으면
        # 테이블 생성이 전부 실패하고 WARN 스택트레이스만 남는다.
        # schema.sql 의 CREATE SCHEMA 로는 늦다 — defer-datasource-initialization 때문에
        # 그 파일이 Hibernate 다음에 실행되기 때문이다.
        # 이 옵션이 Hibernate 가 직접 CREATE SCHEMA 를 내게 해서 init.sql 실행 순서 의존을 없앤다.
        hbm2ddl:
          create_namespaces: true

---
# 배포. 테이블 생성 방식을 다른 서비스와 맞춘다.
# user-service·company-service 처럼 ddl-auto 가 엔티티를 보고 테이블을 만든다.
#
# ddl-auto 만으로는 부족한 것이 둘 있어 local 과 같은 장치를 그대로 쓴다.
#   1. 부분 인덱스(WHERE deleted_at IS NULL)와 CHECK 제약을 ddl-auto 가 만들지 못한다.
#      db/schema.sql 이 그 둘을 덧붙인다. defer-datasource-initialization 이
#      이 파일을 Hibernate 다음에 실행시킨다 (기본은 그 전이라 켜야 한다).
#   2. ddl-auto 는 CREATE SCHEMA 를 내지 않는다. hub_schema 가 없으면 테이블 생성이
#      전부 실패하고 WARN 스택트레이스만 남는다 — 앱은 그대로 뜨기 때문에 조용히 깨진다.
#      create_namespaces 가 Hibernate 에게 직접 CREATE SCHEMA 를 내게 해서
#      docker/postgres/init.sql 이 배포 대상에 도달했는지에 의존하지 않게 한다.
spring:
  config:
    activate:
      on-profile: prod

  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

  jpa:
    defer-datasource-initialization: true
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        hbm2ddl:
          create_namespaces: true

logging:
  level:
    com.delivery_project.hub_service: info
