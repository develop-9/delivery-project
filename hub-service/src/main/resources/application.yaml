server:
  port: 9005

spring:
  application:
    name: hub-service

  # 로컬 실행 시 저장소 루트의 .env 를 프로퍼티로 읽는다. 없어도 기동은 된다(optional).
  # 실행 위치가 저장소 루트일 수도, hub-service 일 수도 있어 두 경로를 모두 건다.
  # 컨테이너 실행 시에는 compose 의 env_file · environment 로 주입되므로 이 줄과 무관하다.
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  profiles:
    default: local

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:hub_db}
    username: ${POSTGRES_USERNAME:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

logging:
  level:
    com.delivery_project.hub_service: debug

---
spring:
  config:
    activate:
      on-profile: local

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

---
spring:
  config:
    activate:
      on-profile: docker

  jpa:
    show-sql: false
    hibernate:
      # 스키마 생성 전략은 3단계(엔티티)에서 확정한다.
      # 부분 인덱스·CHECK 제약은 ddl-auto 가 만들지 못하므로 별도 DDL 이 필요하다.
      ddl-auto: validate

logging:
  level:
    com.delivery_project.hub_service: info
