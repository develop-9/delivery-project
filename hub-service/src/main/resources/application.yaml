spring:
  application:
    name: hub-service

  # .env 를 프로퍼티로 읽어들인다. 파일이 없어도 기동은 된다(optional).
  # 컨테이너 실행 시에는 compose 의 environment 가 우선하므로 이 줄과 충돌하지 않는다.
  config:
    import: optional:file:.env[.properties]

  profiles:
    default: local

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${HUB_DB_URL}
    username: ${HUB_DB_USERNAME}
    password: ${HUB_DB_PASSWORD}

  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

  data:
    redis:
      host: ${HUB_REDIS_HOST}
      port: ${HUB_REDIS_PORT}

server:
  port: 9005

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

logging:
  level:
    com.delivery_project.hub_service: debug

---
spring:
  config:
    activate:
      on-profile: local

  jpa:
    show-sql: true
    hibernate:
      # 스키마 생성 전략은 3단계(엔티티)에서 확정한다.
      # 부분 인덱스·CHECK 제약은 ddl-auto 가 만들지 못하므로 별도 DDL 이 필요하다.
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

---
spring:
  config:
    activate:
      on-profile: docker

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

logging:
  level:
    com.delivery_project.hub_service: info
