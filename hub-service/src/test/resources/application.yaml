# 테스트 전용 설정.
#
# classpath 상 test 리소스가 main 리소스보다 앞서므로 이 파일이
# src/main/resources/application.yaml 을 완전히 대체한다. 따라서 테스트가
# 필요로 하는 값은 여기에 모두 적는다.
#
# 목표: DB·Redis·Eureka 가 하나도 안 떠 있어도 컨텍스트가 뜬다.
# 클론 직후 인프라 없이 ./gradlew test 가 통과해야 팀원이 바로 빌드할 수 있다.
# CI 는 postgres:16 · redis:7-alpine 을 띄우지만, 아래 설정은 연결을
# "시도하지 않는" 쪽이라 인프라가 있든 없든 결과가 같다.

spring:
  application:
    name: hub-service

  # 루트 .env import 는 테스트에서 하지 않는다.
  # 로컬 개발자의 .env 값에 따라 테스트 결과가 달라지면 안 된다.

  datasource:
    url: jdbc:postgresql://localhost:5432/delivery_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      # 커넥션을 못 얻어도 풀 생성을 실패로 처리하지 않는다(기동 차단 방지).
      initialization-fail-timeout: -1

  jpa:
    hibernate:
      # 테스트에서 스키마를 건드리지 않는다.
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        # Dialect 를 명시하지 않으면 Hibernate 가 기동 시 JDBC 로 접속해
        # 메타데이터를 읽으려 하고, DB 가 없으면 여기서 컨텍스트 로딩이 깨진다.
        dialect: org.hibernate.dialect.PostgreSQLDialect
        boot:
          allow_jdbc_metadata_access: false
        # 운영 스키마(hub_schema)가 아니라 public 을 쓴다. Hibernate 는 CREATE SCHEMA 를
        # 내지 않으므로 스키마가 없는 환경에서 테스트가 환경에 좌우된다. company-service 도 동일.
        default_schema: public
        default_batch_fetch_size: 100

  data:
    redis:
      host: localhost
      port: 6379

# 레지스트리가 없는 환경에서 등록·조회 재시도로 시간만 쓰므로 끈다.
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    # 인프라 의존 인디케이터를 끈다. 켜두면 DB·Redis 가 없을 때
    # /actuator/health 가 DOWN(503) 이 되어 테스트가 환경에 좌우된다.
    db:
      enabled: false
    redis:
      enabled: false
    discovery:
      enabled: false

  # zipkin 이 없는 환경에서 span 전송 재시도로 시간만 쓰므로 끈다.
  tracing:
    enabled: false

logging:
  level:
    com.delivery_project.hub_service: debug
